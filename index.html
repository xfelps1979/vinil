<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vinil</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,Helvetica,Arial,sans-serif}
#w{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;height:100%;padding:0 4vw;box-sizing:border-box}
#d{position:relative;width:62vh;height:62vh;min-width:62vh;border-radius:50%}
#v{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle at center,#0c0c0c 0,#0c0c0c 2px,#1c1c1c 3px,#0c0c0c 4px);box-shadow:0 0 0 2px #222,0 0 40px rgba(255,255,255,.05);-webkit-animation:g 4s linear infinite;animation:g 4s linear infinite}
#l{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:#b8472f;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
#h{position:absolute;left:47.5%;top:47.5%;width:5%;height:5%;border-radius:50%;background:#000}
#s{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.09) 50%,rgba(255,255,255,0) 65%)}
#t{margin-left:6vw;max-width:42vw;color:#ddd}
#a{font-size:5.2vh;font-weight:600;line-height:1.15;color:#eee}
#b{margin-top:2vh;font-size:3.2vh;color:#999}
#r{margin-top:1vh;font-size:2.8vh;color:#666}
@-webkit-keyframes g{to{-webkit-transform:rotate(360deg)}}
@keyframes g{to{transform:rotate(360deg)}}
@media (orientation:portrait){#w{-webkit-flex-direction:column;flex-direction:column}#d{width:70vw;height:70vw;min-width:0}#t{margin:6vh 0 0;max-width:86vw;text-align:center}#a{font-size:4.2vw}#b{font-size:3vw}#r{font-size:2.6vw}}
</style></head><body>
<div id="w">
<div id="d"><div id="v"><div id="l"><div id="h"></div></div></div><div id="s"></div></div>
<div id="t"><div id="a">Sem dados</div><div id="b"></div><div id="r"></div></div>
</div>
<script>
(function(){
var h=location.hash.replace(/^#/,''),p=h.split('~');
function d(x){try{return decodeURIComponent((x||'').replace(/\+/g,' '))}catch(e){return x||''}}
if(h){
document.getElementById('a').textContent=d(p[0]);
document.getElementById('b').textContent=d(p[1]);
document.getElementById('r').textContent=d(p[2]);
}
document.addEventListener('touchmove',function(e){e.preventDefault()},false);
})();
</script></body></html>
